# STATE tx train — zeroshot obsm["X_state"], FULL TRAIN (no CV split).
#
# Trains on all cytokines/contexts present in the embeddings atlas, i.e. does NOT
# hold out cytokines for validation. Use 9-fold CV for unbiased held-out metrics.
#
# Run from repo root:
#   bash run_train_state.sh /iridisfs/ddnb/Luke/scFMs/state/experiments/cytokine_validation_zeroshot_2026_04_01/full_train/configs/config_all.yaml
#
training:
  data:
    toml_config_path: "/iridisfs/ddnb/Luke/scFMs/state/experiments/cytokine_validation_zeroshot_2026_04_01/full_train/tomls/cytokine_atlas_zeroshot_Xstate_all.toml"
    num_workers: 8
    batch_col: "sample"
    pert_col: "cytokine"
    cell_type_key: "cell_type"
    control_pert: "PBS"
    perturbation_features_file: /iridisfs/ddnb/Luke/data/parse-10M-90cytokines/esm2_pert_features.pt
    embed_key: "X_state"

  training:
    batch_size: 64
    max_steps: 100000
    ckpt_every_n_steps: 5000

  model: "state_sm"

  wandb:
    tags: "[cytokine_zeroshot_Xstate,full_train]"
    project: "vcc"
    entity: "arcinstitute"

  output:
    output_dir: "/iridisfs/ddnb/Luke/scFMs/state/experiments/cytokine_validation_zeroshot_2026_04_01/full_train/output"
    name: "run_zeroshot_Xstate_all"
