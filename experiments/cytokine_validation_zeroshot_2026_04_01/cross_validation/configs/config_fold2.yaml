# STATE tx train — zeroshot obsm["X_state"], CV fold 2.
# TOML splits match cytokine_validation_2026_03/cross_validation/tomls/cytokine_fold2.toml
# (atlas path: emb_zeroshot/embeddings/atlas/cytokine_atlas_emb_full.h5ad).
#
# Run from repo root:
#   bash run_train_state.sh /iridisfs/ddnb/Luke/scFMs/state/experiments/cytokine_validation_zeroshot_2026_04_01/cross_validation/configs/config_fold2.yaml
#   sbatch /iridisfs/ddnb/Luke/scFMs/state/experiments/cytokine_validation_zeroshot_2026_04_01/cross_validation/run_tx_train_cytokine_zeroshot.sh  # default fold=1; set FOLD=N

training:
  data:
    toml_config_path: "/iridisfs/ddnb/Luke/scFMs/state/experiments/cytokine_validation_zeroshot_2026_04_01/cross_validation/tomls/cytokine_atlas_zeroshot_Xstate_cv_fold2.toml"
    num_workers: 8
    batch_col: "sample"
    pert_col: "cytokine"
    cell_type_key: "cell_type"
    control_pert: "PBS"
    perturbation_features_file: /iridisfs/ddnb/Luke/data/parse-10M-90cytokines/esm2_pert_features.pt
    embed_key: "X_state"

  training:
    batch_size: 64
    max_steps: 100000
    ckpt_every_n_steps: 5000

  model: "state_sm"

  wandb:
    tags: "[cytokine_zeroshot_Xstate,cv_fold2]"
    project: "vcc"
    entity: "arcinstitute"

  output:
    output_dir: "/iridisfs/ddnb/Luke/scFMs/state/experiments/cytokine_validation_zeroshot_2026_04_01/cross_validation"
    name: "run_zeroshot_Xstate_fold2"
