# Configuration file for full STATE model run pipeline
# This file contains all arguments needed for steps 01-06

# ============================================================================
# Step 01: Training Configuration
# ============================================================================
training:
  # SLURM job settings
  slurm:
    nodes: 1
    time: "60:00:00"
    mem: "150G"
    partition: "l40"
    gpus: 2
    cpus_per_task: 12
  
  # Data configuration
  data:
    toml_config_path: "/iridisfs/ddnb/Luke/scFMs/state/experiments/cytokine_validation_2026/cytokine.toml"
    num_workers: 8
    batch_col: "sample"
    pert_col: "cytokine"
    cell_type_key: "cell_type"
    control_pert: "PBS"
    # Optional: path to a .pt file with perturbation features (e.g. ESM2 embeddings)
    perturbation_features_file: /iridisfs/ddnb/Luke/data/parse-10M-90cytokines/esm2_pert_features.pt


  
  # Training hyperparameters
  training:
    batch_size: 64
    max_steps: 100000
    ckpt_every_n_steps: 5000
  
  # Model configuration
  model: "state_sm"
  
  # Weights & Biases configuration
  wandb:
    tags: "[cytokine_val]"
    project: "vcc"
    entity: "arcinstitute"
  
  # Output configuration
  output:
    output_dir: "/iridisfs/ddnb/Luke/scFMs/state/experiments/cytokine_validation_2026"
    name: "run_2026_02_11_10Donors"

# ============================================================================
# Step 02: Inference Configuration
# ============================================================================
inference:
  # SLURM job settings
  slurm:
    nodes: 1
    time: "60:00:00"
    mem: "100G"
    partition: "l40"
    gpus: 2
    cpus_per_task: 12
  
  # Inference paths and settings
  output: "experiments/replogle_cytokine_experiment/run1_2025_12_19/predictions/cd14mono_PBS_replogle_prediction.h5ad"
  model_dir: "experiments/replogle_cytokine_experiment/run1_2025_12_19/"
  checkpoint: "final.ckpt"
  adata: "/iridisfs/ddnb/Luke/scFMs/state/experiments/replogle_cytokine_experiment/templates_top10/cd14mono__IL-4__template_raw.h5ad" #make template
  pert_col: "pert_gene_test"
  control_pert: "PBS"
