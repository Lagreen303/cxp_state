# Finetuning config: same setup as run_2026_02_11_all, but starting from a pretrained checkpoint
# Use the tx checkpoint from run_2026_02_11_all (NOT the embedding checkpoint from run_get_embedding.sh)

# ============================================================================
# Step 01: Training Configuration
# ============================================================================
training:
  slurm:
    nodes: 1
    time: "60:00:00"
    mem: "150G"
    partition: "l40"
    gpus: 2
    cpus_per_task: 12

  data:
    toml_config_path: "/iridisfs/ddnb/Luke/scFMs/state/experiments/cytokine_validation_2026/cytokine.toml"
    num_workers: 8
    batch_col: "sample"
    pert_col: "cytokine"
    cell_type_key: "cell_type"
    control_pert: "PBS"
    perturbation_features_file: /iridisfs/ddnb/Luke/data/parse-10M-90cytokines/esm2_pert_features.pt

  training:
    batch_size: 64
    max_steps: 100000
    ckpt_every_n_steps: 5000

  model: "state_sm"

  # Pretrained checkpoint to start from (tx model checkpoint, not embedding model)
  init_from: "/iridisfs/ddnb/Luke/scFMs/state/experiments/cytokine_validation_2026/run_2026_02_11_all/checkpoints/step=80000.ckpt"

  wandb:
    tags: "[cytokine_val]"
    project: "vcc"
    entity: "arcinstitute"

  output:
    output_dir: "/iridisfs/ddnb/Luke/scFMs/state/experiments/cytokine_validation_2026"
    name: "run_2026_02_11_all_finetuned"

# ============================================================================
# Step 02: Inference Configuration (copy from main config if needed)
# ============================================================================
inference:
  slurm:
    nodes: 1
    time: "60:00:00"
    mem: "100G"
    partition: "l40"
    gpus: 2
    cpus_per_task: 12
